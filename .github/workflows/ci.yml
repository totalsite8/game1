name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Browser smoke tests
        run: |
          node scripts/browser-libs.mjs
          npm run preview > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/api/health && break || sleep 1; done
          TEST_URL=http://localhost:4173 LD_LIBRARY_PATH=/tmp/route-browser-libs/lib npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
