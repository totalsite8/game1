name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Browser smoke tests
        run: |
          node scripts/browser-libs.mjs
          npm run preview > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/api/health && break || sleep 1; done
          TEST_URL=http://localhost:4173 LD_LIBRARY_PATH=/tmp/route-browser-libs/lib npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
